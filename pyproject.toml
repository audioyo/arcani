[project]
name = "arcani"
version = "0.0.1"
description = "Arcani Python reference renderer and signal tests"
requires-python = "==3.14.*"
dependencies = [
    "numpy==2.5.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/cmake"]
addopts = "-ra"
